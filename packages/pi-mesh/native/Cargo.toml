[package]
name = "pi-mesh-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "pi-mesh"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "net"] }
zenoh = "1.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
