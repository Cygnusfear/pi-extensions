<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__ATLAS_TITLE__</title>
<style>
:root{--paper:#0d3b6d;--paper2:#0a3160;--ink:#eef6ff;--ink2:#b3cce6;--hair:#52759a;--hot:#7ff0ff;--warm:#ffb15e;--mono:"SFMono-Regular",Menlo,Consolas,monospace}
html[data-theme="light"]{--paper:#f3f7fc;--paper2:#e7eef8;--ink:#0c3a6b;--ink2:#496786;--hair:#a4b7ce;--hot:#0062a8;--warm:#965100}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:var(--paper);color:var(--ink);font:12px/1.5 var(--mono)}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;height:100dvh;overflow:hidden}.top{display:flex;border-bottom:1px solid var(--ink);min-width:0}.stat{padding:8px 12px;border-right:1px solid var(--hair);display:flex;flex-direction:column;justify-content:center;white-space:nowrap;min-width:0}.stat:first-child{flex:1;overflow:hidden}.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}.v{font-size:17px;line-height:1.2}.v small{display:block;font-size:9px;color:var(--ink2);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;max-width:350px}.spacer{flex:1}.btns{display:flex;gap:6px;align-items:center;padding:0 12px}.btn,.ch{background:none;border:1px solid var(--hair);padding:6px 9px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.btn:hover,.ch:hover{border-color:var(--ink)}.btns .btn{border-color:var(--ink)}
.chapters{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--hair);overflow:auto}.lbl{font-size:9px;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase;margin-right:5px}.ch[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mid{display:grid;grid-template-columns:210px minmax(0,1fr) 310px;min-height:0}.side{border-right:1px solid var(--hair);overflow:auto;padding:8px 10px 24px}.gh{display:flex;justify-content:space-between;gap:8px;margin:16px 3px 6px;color:var(--ink2);font-size:9px;letter-spacing:.12em;text-transform:uppercase}.gh span:first-child{overflow-wrap:anywhere}.row{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);padding:5px 6px;margin:0 0 4px;background:none;width:100%;text-align:left}.cd{border:1px solid var(--ink);padding:0 3px;font-size:9px;min-width:27px;text-align:center}.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;font-size:10px}.row:hover{border-color:var(--ink)}.row.on{background:var(--ink);color:var(--paper)}.row.on .cd{border-color:var(--paper)}.ghost{opacity:.55}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--paper);isolation:isolate}#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.plabel{border:0;background:var(--paper);padding:1px 3px;pointer-events:auto;font-size:11px;letter-spacing:.05em;line-height:1.25;color:var(--ink);white-space:nowrap}.plabel.on{color:var(--hot)}.plabel.gone{color:var(--ink2)}.zlabel{background:var(--paper);padding:1px 4px;font-size:9px;color:var(--ink2);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.elabel{background:var(--paper);padding:1px 4px;color:var(--ink2);font-size:10px;white-space:nowrap}.zoomnote{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:4px 8px;border:1px solid var(--hair);background:var(--paper);color:var(--ink2);font-size:9px;letter-spacing:.06em;pointer-events:none;opacity:0;white-space:nowrap}.zoomnote.show{opacity:1}
.panel{border-left:1px solid var(--hair);min-height:0;overflow:auto;background:var(--paper)}.tabs{display:flex;position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--hair);z-index:2}.tab{flex:1;padding:11px 6px;border:0;background:none;font-size:10px;text-transform:uppercase;letter-spacing:.06em}.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}.pb{padding:18px 16px}.k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:18px 0 5px}.k:first-child{margin-top:0}.pt{font-size:18px;font-weight:500;margin:0;overflow-wrap:anywhere}.ps{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:5px 0 18px}.pb p{line-height:1.7;overflow-wrap:anywhere}.facts{display:grid;grid-template-columns:75px 1fr;gap:7px;font-size:11px}.facts dt{color:var(--ink2);font-size:9px;text-transform:uppercase}.facts dd{margin:0;overflow-wrap:anywhere}.cxs{display:flex;flex-direction:column;gap:10px}.cx{display:grid;grid-template-columns:30px 10px 30px 1fr;gap:5px;font-size:10px}.cxa{font-size:9px}.cxl{color:var(--ink2);overflow-wrap:anywhere}.plate{margin:0 16px 16px;padding:12px 0;border-top:1px solid var(--hair);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.plate b{display:block}.plate .sub{margin-top:8px;color:var(--ink2);line-height:1.7}.key{margin:0 16px 20px;padding-top:12px;border-top:1px solid var(--hair);font-size:9px;text-transform:uppercase}.key b{display:block;letter-spacing:.12em;margin-bottom:9px}.key div{display:flex;gap:9px;margin:7px 0;color:var(--ink2)}.key svg{width:24px;height:16px;flex:none}.foot{display:flex;gap:20px;border-top:1px solid var(--hair);padding:6px 12px;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}.mbtns,.sideclose,.grab{display:none}
@media(max-width:1050px){.mid{grid-template-columns:170px minmax(0,1fr) 260px}.stat:nth-child(n+3){display:none}.foot{gap:10px}}
@media(max-width:760px){.mid{grid-template-columns:1fr;grid-template-rows:minmax(240px,1fr) minmax(0,.65fr)}.mid.expanded{grid-template-rows:minmax(160px,.55fr) minmax(0,1fr)}.side{position:fixed;inset:0;z-index:20;background:var(--paper);transform:translateX(-100%)}.side.open{transform:none}.sideclose{display:block;margin-bottom:12px}.panel{border-left:0;border-top:1px solid var(--hair)}.btns{display:none}.mbtns{display:flex;align-items:center;gap:5px;padding:0 8px}.stat:nth-child(n+2){display:none}.v{font-size:14px}.v small{max-width:170px}.foot{display:none}.grab{display:block;width:100%;height:18px;border:0;background:none}.grab:after{content:"";display:block;margin:auto;width:36px;border-top:3px solid var(--hair)}.plate,.key{display:none}.chapters{padding:5px 8px}.plabel{font-size:10px}.zlabel{font-size:8px}}
.playback{display:flex;align-items:center;gap:6px;padding:7px 12px;border-bottom:1px solid var(--hair);overflow:auto}.playback select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--hair);padding:5px;max-width:180px}.playback .btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}#flow-status{font-size:10px;white-space:nowrap;color:var(--ink2)}.flow-story{padding:12px 16px;border-bottom:1px solid var(--hair);font-size:11px;line-height:1.7}.flow-story:empty{display:none}@media(max-width:760px){.playback{display:grid;grid-template-columns:auto auto 1fr;align-items:stretch;gap:4px;padding:4px 6px}.playback .btn{padding:4px 7px;font-size:9px}.playback select{max-width:none;width:100%;padding:4px 3px;font-size:9px}#playback-controls{display:flex;gap:4px}.playback .btn{flex:1}#flow-status{grid-column:1/4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mbtns{padding:0 6px}.mbtns .btn{padding:4px 7px}.top .stat{padding:5px 8px}.v{font-size:13px}.chapters{padding:4px 6px;gap:4px}.ch{padding:4px 6px;font-size:9px}}
.selected-heading{display:none}@media(max-width:760px){.panel-head{position:sticky;top:0;z-index:3;background:var(--paper)}.panel-head .tabs{position:static}.selected-heading{display:block;padding:10px 16px 4px;font-size:14px;font-weight:bold;line-height:1.35;overflow-wrap:anywhere}.panel-head .grab{height:12px}.mid{grid-template-rows:minmax(160px,1fr) minmax(160px,.8fr)}.panel{padding-bottom:env(safe-area-inset-bottom)}}
</style>
</head>
<body>
<div class="app">
<header class="top">
<!--__ATLAS_STATS__-->
<div class="mbtns"><button class="btn" id="menuBtn">Index</button><button class="btn" id="mreset">Fit</button><button class="btn" id="mtheme" aria-label="Switch theme">◐</button></div>
<div class="btns"><button class="btn" id="reset">Reset view</button><button class="btn" id="theme">Light</button><button class="btn" id="export">Export PNG</button></div>
</header>
<nav class="chapters" id="chapters" aria-label="Guided views"></nav>
<div class="playback" aria-label="Projection and flow playback"><button class="btn" data-projection="flow" aria-pressed="false">Flow</button><button class="btn" data-projection="infra" aria-pressed="true">Infra</button><select id="flow-select" aria-label="Flow sequence"></select><span id="playback-controls"><button class="btn" id="play" aria-pressed="false">Play</button><button class="btn" id="step">Step</button><button class="btn" id="restart-flow">Restart</button></span><span id="flow-status" role="status"></span></div><div class="mid" id="mid">
<nav class="side" id="side" aria-label="Components"><button class="btn sideclose" id="sideClose">Close index</button></nav>
<main class="stage" id="stage" aria-label="Interactive architecture"><canvas id="gl"></canvas><div id="labels" class="labels"></div><div class="zoomnote" id="zoomnote">Select a component or zoom in for connections</div></main>
<aside class="panel"><div class="panel-head"><div id="selected-heading" class="selected-heading" aria-live="polite"></div><button class="grab" id="grab" aria-label="Expand panel"></button><div class="tabs"><button class="tab" id="tdoes" aria-selected="true">What it does</button><button class="tab" id="tbuilt" aria-selected="false">How it’s built</button></div></div><div id="flow-story" class="flow-story"></div><div class="pb" id="pb"></div>
<!--__ATLAS_PLATE__-->
<!--__ATLAS_KEY__-->
</aside>
</div>
<footer class="foot"><span>Drag to pan</span><span>Right-drag to orbit</span><span>Scroll to zoom</span><span>Esc resets</span><span class="spacer"></span><span id="projection-note">Atlas · 2:1 dimetric</span></footer>
</div>
<!--__PRISM_SCRIPT__-->
</body>
</html>
