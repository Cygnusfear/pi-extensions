<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>__ATLAS_TITLE__</title>
<style>
:root{
  --paper:#0d3b6d; --paper2:#0a3160; --ink:#eef6ff; --ink2:rgba(238,246,255,.66); --hair:rgba(238,246,255,.30);
  --grid:rgba(238,246,255,.09); --gridmaj:rgba(238,246,255,.18); --hot:#7ff0ff; --warm:#ffb15e;
  --mono:"JetBrains Mono","IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
}
html[data-theme="light"]{
  --paper:#f3f7fc; --paper2:#e7eef8; --ink:#0c3a6b; --ink2:rgba(12,58,107,.68); --hair:rgba(12,58,107,.32);
  --grid:rgba(12,58,107,.09); --gridmaj:rgba(12,58,107,.2); --hot:#0a84ff; --warm:#c26a00;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--paper);color:var(--ink);font:12px/1.5 var(--mono)}
.app{position:relative;display:grid;grid-template-rows:auto min-content minmax(0,1fr) auto;height:100vh;height:100dvh;min-width:0;overflow:hidden}
.top{display:flex;align-items:stretch;border-bottom:1px solid var(--ink);min-width:0;overflow:hidden}
.stat{flex:0 1 auto;min-width:0;padding:7px 12px 8px;border-right:1px solid var(--hair);display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
.eyebrow{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.v{font-size:17px;line-height:1.15}
.v small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-left:6px}
.spacer{flex:1}
.btns{display:flex;gap:6px;align-items:center;padding:0 12px;flex:none}
.btn{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:6px 10px;font:inherit;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn:hover,.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mid{display:grid;grid-template-columns:230px minmax(0,1fr) 400px;min-height:0;min-width:0}
.side{border-right:1px solid var(--ink);overflow-y:auto;overflow-x:hidden;padding:10px 10px 24px}
.gh{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:12px 4px 5px}
.row{display:flex;align-items:center;gap:8px;border:1px solid var(--hair);border-radius:2px;padding:4px 6px;margin:0 0 4px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;width:100%;text-align:left}
.row .cd{font-size:9px;letter-spacing:.06em;border:1px solid var(--ink);padding:1px 3px;border-radius:2px;min-width:26px;text-align:center}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em}
.row:hover{border-color:var(--ink)}
.row.on{background:var(--ink);color:var(--paper)}
.row.on .cd{border-color:var(--paper)}
.row.ghost .nm,.row.ghost .cd{opacity:.55}
.stage{position:relative;min-width:0;overflow:hidden;cursor:grab;background:var(--paper)}
.stage.drag{cursor:grabbing}
#scene{width:100%;height:100%;display:block}
.tip{position:absolute;pointer-events:none;background:var(--paper2);border:1px solid var(--ink);padding:5px 8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:none;transform:translate(12px,-50%);z-index:3;white-space:nowrap}
.plate{position:absolute;left:18px;top:14px;border:1px solid var(--ink);background:var(--paper);padding:8px 12px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.6;pointer-events:none}
.plate b{display:block;font-size:11px;letter-spacing:.14em}
.plate .sub{color:var(--ink2);border-top:1px solid var(--hair);margin-top:5px;padding-top:5px}
.key{position:absolute;right:18px;bottom:16px;border:1px solid var(--ink);background:var(--paper);padding:8px 12px 10px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;pointer-events:none;min-width:250px}
.key b{display:block;font-size:10px;letter-spacing:.14em;border-bottom:1px solid var(--hair);padding-bottom:5px;margin-bottom:6px}
.key div{display:flex;align-items:center;gap:10px;margin:3px 0}
.key svg{width:24px;height:16px;flex:none;overflow:visible}
.panel{border-left:1px solid var(--ink);overflow-y:auto;display:flex;flex-direction:column;background:var(--paper)}
.tabs{display:flex;border-bottom:1px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:2}
.tab{flex:1;text-align:center;padding:11px 8px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border:0;background:none;color:var(--ink);font-family:inherit}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.pb{padding:16px 18px 28px}
.k{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:14px 0 4px}
.k:first-child{margin-top:0}
.pt{margin:0;font-size:17px;font-weight:600;letter-spacing:.02em}
.ps{margin:2px 0 12px;color:var(--ink2);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.pb p{font-size:12px;line-height:1.6;margin:0 0 10px}
.facts{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:11px;line-height:1.55}
.facts dt{color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;font-size:9.5px;padding-top:2px}
.facts dd{margin:0}
.chip{border:1px solid var(--ink);padding:0 4px;border-radius:2px;font-size:10.5px}
.foot{border-top:1px solid var(--ink);display:flex;align-items:center;padding:5px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);gap:20px}
.foot .spacer{flex:1}
.gl{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke}
.gl.maj{stroke:var(--gridmaj)}
.face{stroke:var(--ink);stroke-width:1.25;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.face.top{fill:var(--paper)}
.blk{cursor:pointer}
.blk .hit{fill:transparent;stroke:none}
.blk.hov .face,.blk.on .face{stroke-width:2.1}
.blk.on .face.top{fill:var(--ink)}
.blk.on .cd-t{fill:var(--paper)}
.blk.dim{opacity:.32}
.dash .face{stroke-dasharray:4 3;fill:none}
#camera{--kinv:1}
.cd-t{font-weight:600;font-size:calc(13px * var(--kinv));font-family:var(--mono);letter-spacing:.06em;fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.edge{fill:none;stroke:var(--ink);stroke-width:1.15;opacity:.5;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.edge.d{stroke-dasharray:5 4}
.edge.w{stroke:var(--warm)}
.edge.lit{opacity:1;stroke-width:2;stroke:var(--hot)}
.edge.w.lit{stroke:var(--warm)}
.edge.dim,.mark.dim{opacity:.08}
.mark{fill:var(--paper);stroke:var(--ink);stroke-width:1.1;vector-effect:non-scaling-stroke}
.mark.lit{stroke:var(--hot);fill:var(--hot)}
.bnd{fill:none;stroke:var(--ink);stroke-width:1.05;stroke-dasharray:7 5;opacity:.55;vector-effect:non-scaling-stroke}
.bnd.gone{stroke-dasharray:3 4;opacity:.4}
.blbg{fill:var(--paper)}
.bl{font-size:calc(9.5px * var(--kinv));font-family:var(--mono);letter-spacing:.16em;fill:var(--ink2);dominant-baseline:central}
.el.hide,.blbg.hide{opacity:0;pointer-events:none}
.el{font-size:calc(9px * var(--kinv));font-family:var(--mono);letter-spacing:.06em;fill:var(--ink2);text-anchor:middle;dominant-baseline:central}
.flowdot{fill:var(--hot);stroke:var(--paper);stroke-width:2}

.chapters{display:flex;gap:6px;align-items:center;flex:none;padding:6px 12px;border-bottom:1px solid var(--ink);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
.chapters .lbl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);padding-right:4px;flex:none}
.ch{flex:none;background:transparent;color:var(--ink);border:1px solid var(--hair);border-radius:2px;padding:5px 9px;font:inherit;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.ch:hover{border-color:var(--ink)}
.ch[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.el,.bl{transition:opacity .15s}
#scene.terse .el{opacity:0;pointer-events:none}
#scene.terse .bl{opacity:.55}
.zoomnote{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);border:1px solid var(--hair);background:var(--paper);color:var(--ink2);padding:4px 10px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .2s}
.zoomnote.show{opacity:1}
.keybox{border:1px solid var(--hair);padding:10px 12px;margin-top:6px}
.keybox div{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.keybox svg{width:24px;height:16px;flex:none;overflow:visible}
.cxs{display:flex;flex-direction:column;gap:4px}
.cx{display:grid;grid-template-columns:34px 14px 34px 1fr;gap:6px;align-items:baseline;font-size:11px}
.cxa{border:1px solid var(--hair);border-radius:2px;padding:0 3px;text-align:center;font-size:9.5px;letter-spacing:.06em}
.cxr{color:var(--ink2);text-align:center}
.cxl{color:var(--ink2);overflow-wrap:anywhere}

/* ---------- responsive ---------- */
.mbtns{display:none}
.sideclose{display:none}
.grab{display:none}
@media (max-width:920px){
  .app{grid-template-rows:auto 0px minmax(0,1fr) auto}
  .chapters{position:absolute;left:0;right:0;z-index:6;background:var(--paper);border-bottom:1px solid var(--hair);padding:6px 10px}
  .chapters .lbl{display:none}
  .ch{padding:6px 9px;font-size:10.5px}
  .plate{display:none}
  .cd-t{font-size:calc(14px * var(--kinv))}
  #scene.terse .bl{opacity:0}
  .v small{display:none}
  .stat:first-child{max-width:132px}

  body{font-size:12px}
  .app{grid-template-rows:auto minmax(0,1fr) auto}
  .top{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-right:4px}
  .top::-webkit-scrollbar{display:none}
  .stat{flex:none;padding:6px 10px 7px}
  .v{font-size:15px}
  .btns{display:none}
  .mbtns{display:flex;gap:6px;align-items:center;padding:0 8px;flex:none;position:sticky;right:0;background:var(--paper);border-left:1px solid var(--hair)}
  .mbtns .btn{padding:6px 8px;font-size:11px}
  .mid{grid-template-columns:1fr;grid-template-rows:minmax(120px,1fr) minmax(0,.78fr)}
  .mid.expanded{grid-template-rows:minmax(90px,.55fr) minmax(0,1.6fr)}
  .side{position:fixed;inset:0;z-index:30;background:var(--paper);border-right:0;transform:translateX(-102%);transition:transform .22s ease;padding:12px 12px 40px}
  .side.open{transform:none}
  .sideclose{display:block;width:100%;margin-bottom:10px;position:sticky;top:0}
  .stage{min-height:0}
  .plate{left:10px;top:10px;padding:6px 9px;font-size:9px;max-width:62vw}
  .plate .sub{display:none}
  .key{display:none}
  .tip{display:none!important}
  .panel{border-left:0;border-top:1px solid var(--ink);max-height:none;min-height:0;position:relative}
  .grab{display:block;width:100%;border:0;background:none;padding:7px 0 3px;cursor:pointer}
  .grab::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto}
  .tabs{top:0}
  .pb{padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
  .foot{display:none}
}
@media (max-width:560px){
  .stat:nth-child(n+4){display:none}
  .plate{max-width:70vw}
}
/* prism register: CSS labels over the WebGL stage */
.stage { position: relative; cursor: grab; }
#gl { width: 100%; height: 100%; display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.plabel { pointer-events: auto; cursor: pointer; transform: translate(-50%, -115%); font-family: var(--mono); text-align: center; color: var(--ink); white-space: nowrap; }
/* Label type scales inversely with the camera: codes stay legible on a whole-plate view,
   names and relationship labels appear when the reader zooms in. */
.labels { --lk: 1; }
.plabel b { display: block; font-size: calc(9px * var(--lk)); letter-spacing: .1em; }
.plabel span { display: block; font-size: calc(7.5px * var(--lk)); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.plabel.on b { color: var(--hot); }
.plabel.gone b, .plabel.gone span { opacity: 0.6; }
.zlabel { transform: translate(-50%, -50%); font-family: var(--mono); font-size: calc(8px * var(--lk, 1)); letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); white-space: nowrap; }
.elabel { transform: translate(-50%, -50%); font-family: var(--mono); font-size: calc(9px * var(--lk, 1)); letter-spacing: .06em; color: var(--ink); background: var(--paper); padding: 1px 5px; border: 1px solid var(--hair); white-space: nowrap; }
body.zoomed-out .plabel span { display: none; }
body.zoomed-out .elabel { display: none; }
</style>
</head>
<body>
<div class="app">
<header class="top">
<!--__ATLAS_STATS__-->
  <div class="spacer"></div>
  <div class="mbtns">
    <button class="btn" id="menuBtn" aria-label="Open the index">Index</button>
    <button class="btn" id="mplay" aria-label="Resume the flow">&#9654;</button>
    <button class="btn" id="mstep" aria-label="Trace one step">&rarr;</button>
    <button class="btn" id="mreset" aria-label="Reset view">Fit</button>
    <button class="btn" id="mtheme" aria-label="Switch theme">&#9681;</button>
  </div>
  <div class="btns">
    <button class="btn" id="play">&#9654; Resume the flow</button>
    <button class="btn" id="step">Trace one step</button>
    <button class="btn" id="reset">Reset view</button>
    <button class="btn" id="theme">Light</button>
    <button class="btn" id="export">Export PNG</button>
  </div>
</header>
<nav class="chapters" id="chapters" aria-label="Guided views"></nav>
<div class="mid" id="mid">
  <nav class="side" id="side"><button class="btn sideclose" id="sideClose">Close index</button></nav>
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div id="labels" class="labels"></div>
    <!--__ATLAS_PLATE__-->
    <!--__ATLAS_KEY__-->
    </div>
    <div class="tip" id="tip"></div>
    <div class="zoomnote" id="zoomnote">Zoom in for the labels</div>
  </main>
  <aside class="panel" id="panel">
    <button class="grab" id="grab" aria-label="Expand or collapse the panel"></button>
    <div class="tabs"><button class="tab" id="tdoes" aria-selected="true">What it does</button><button class="tab" id="tbuilt" aria-selected="false">How it&rsquo;s built</button></div>
    <div class="pb" id="pb"></div>
  </aside>
</div>
<footer class="foot"><span>&rarr; Trace one step</span><span>Hover to read</span><span>Drag to pan</span><span>Scroll to zoom</span><span>Esc resets</span><span class="spacer"></span><span>Plate 1 &middot; 2:1 dimetric &middot; helpdesk 2026-09-14 &middot; velosport staging</span></footer>
</div>
<!--__PRISM_SCRIPT__-->
</body>
</html>
